{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mi sitio web{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/mountain.svg' %}" type="image/svg+xml">
    {% block extra_head %}{% endblock %}
    <script src="{% static 'js/script.js' %}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="site-brand" href="{% url 'core:homepage' %}">Mi sitio web</a>
        <nav aria-label="Navegación principal">
            <a href="{% url 'core:homepage' %}">Inicio</a>
            <a href="{% url 'escaparate:homepage' %}">Escaparate</a>
            <a href="{% url 'core:contacto' %}">Contacto</a>
        </nav>
    </header>

    <main class="site-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="current-year"></span> Mi sitio web</p>
    </footer>
</body>
</html>
